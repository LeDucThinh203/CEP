<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CEP Customer Management System</title>
    <base href="/" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="CEP.FrontEnd.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;font-family:Roboto,sans-serif;">
            <div style="border: 4px solid #f3f3f3;border-top: 4px solid #1976d2;border-radius: 50%;width: 44px;height: 44px;animation: spin 1s linear infinite;margin: 0 auto 12px;"></div>
            <p style="color:#555;font-weight:500;">Đang khởi động CEP System...</p>
        </div>
        <style>
            @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        </style>
    </div>

    <div id="blazor-error-ui">
        Đã có lỗi xảy ra.
        <a href="" class="reload">Tải lại</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>

</html>
